<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><style>/* cyber-tech — 赛博朋克 + 终端美学 + 霓虹光效 */
* { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

html, body {
  width: 1920px; height: 1080px; overflow: hidden;
  background: #06080D;
  color: #D4D4D8;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  -webkit-font-smoothing: antialiased;
}

.slide {
  width: 1920px; height: 1080px;
  padding: 90px 100px;
  display: flex; flex-direction: column;
  position: relative;
}

.accent { color: #00FF88; }
.accent-blue { color: #00D4FF; }
.muted { color: #52525B; }
.subtitle-safe-zone { height: 130px; flex-shrink: 0; }

/* 网格背景 */
.slide::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none; z-index: 0;
}
.slide > * { position: relative; z-index: 1; }

.slide-number {
  position: absolute; top: 36px; right: 60px;
  font-size: 14px; font-weight: 600;
  color: #00D4FF;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 2px;
}
.slide-number::before { content: '// '; color: #00FF88; }

table { border-collapse: collapse; width: 100%; margin-top: 24px;
        border: 1px solid rgba(0,255,136,0.12); }
th, td { font-size: 26px; padding: 14px 22px; text-align: left;
         border-bottom: 1px solid rgba(0,255,136,0.08); }
th { color: #00FF88; font-weight: 700; font-size: 22px;
     background: rgba(0,255,136,0.04); }
</style>
<style>
  .slide { justify-content: center; align-items: center; text-align: center; padding-bottom: 190px; }
  .quote-tag {
    font-size: 35px; color: #00D4FF; font-weight: 600;
    letter-spacing: 5px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 28px;
  }
  .quote-text {
    font-size: 64px; font-weight: 500; line-height: 1.5;
    max-width: 1300px; color: #E4E4E7;
    text-shadow: 0 0 15px rgba(0,255,136,0.08);
  }
  .quote-line {
    width: 60px; height: 1px; background: #00FF88;
    margin: 28px auto;
    box-shadow: 0 0 8px rgba(0,255,136,0.3);
  }
  .quote-source { font-size: 44px; color: #52525B; font-family: 'JetBrains Mono', monospace; }
  .quote-source::before { content: '-- '; color: #00D4FF; }
</style>
</head>
<body>
<div class="slide">
  <div class="quote-tag">/* QUOTE */</div>
  <p class="quote-text">所有中间产物都是可读文件，你可以随时修改任意一页重新合成</p>
  <div class="quote-line"></div>
  <p class="quote-source">ppt-video-generator</p>
</div>
</body>
</html>
