<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><style>/* cyber-tech — 赛博朋克 + 终端美学 + 霓虹光效 */
* { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

html, body {
  width: 1920px; height: 1080px; overflow: hidden;
  background: #06080D;
  color: #D4D4D8;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  -webkit-font-smoothing: antialiased;
}

.slide {
  width: 1920px; height: 1080px;
  padding: 90px 100px;
  display: flex; flex-direction: column;
  position: relative;
}

.accent { color: #00FF88; }
.accent-blue { color: #00D4FF; }
.muted { color: #52525B; }
.subtitle-safe-zone { height: 130px; flex-shrink: 0; }

/* 网格背景 */
.slide::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none; z-index: 0;
}
.slide > * { position: relative; z-index: 1; }

.slide-number {
  position: absolute; top: 36px; right: 60px;
  font-size: 14px; font-weight: 600;
  color: #00D4FF;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 2px;
}
.slide-number::before { content: '// '; color: #00FF88; }

table { border-collapse: collapse; width: 100%; margin-top: 24px;
        border: 1px solid rgba(0,255,136,0.12); }
th, td { font-size: 26px; padding: 14px 22px; text-align: left;
         border-bottom: 1px solid rgba(0,255,136,0.08); }
th { color: #00FF88; font-weight: 700; font-size: 22px;
     background: rgba(0,255,136,0.04); }
</style>
<style>
  .slide { padding-top: 85px; }
  .main-grid { display: flex; gap: 0; height: calc(1080px - 170px - 130px); }
  /* 左侧终端面板 */
  .left-terminal {
    width: 350px; flex-shrink: 0;
    background: rgba(0,255,136,0.025);
    border-right: 1px solid rgba(0,255,136,0.08);
    border-radius: 0 0 0 12px;
    display: flex; flex-direction: column;
    padding: 40px 30px;
    gap: 16px;
    position: relative;
  }
  .left-terminal::before {
    content: 'SYS.LOG';
    font-size: 28px; color: #00D4FF; font-weight: 600;
    letter-spacing: 4px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 12px;
  }
  .left-terminal .log-line {
    font-size: 29px; color: #52525B;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1.8;
  }
  .left-terminal .log-line.active { color: #00FF88; }
  /* 右侧内容 */
  .right-main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 70px; }
  .page-header { display: flex; align-items: center; gap: 16px; margin-bottom: 48px; }
  .header-tag {
    font-size: 31px; color: #00FF88; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid rgba(0,255,136,0.2);
    padding: 6px 16px;
  }
  .page-title {
    font-size: 63px; font-weight: 700; line-height: 1.25;
    color: #E4E4E7;
  }
  .bullets { list-style: none; padding: 0 0 0 97px; display: flex; flex-direction: column; gap: 22px; }
  .bullets li {
    font-size: 48px; line-height: 1.55;
    padding-left: 36px; position: relative;
    color: #A1A1AA;
  }
  .bullets li::before {
    content: '>';
    position: absolute; left: 0; top: 0;
    color: #00FF88; font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
    font-size: 41px;
  }
  /* 右下角终端装饰 */
  .term-box {
    position: absolute; bottom: 160px; right: 60px;
    border: 1px solid rgba(0,255,136,0.1);
    padding: 12px 18px;
    font-size: 28px; color: #52525B;
    font-family: 'JetBrains Mono', monospace;
  }
  .term-box .green { color: #00FF88; }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-number">08 / 09</div>
  <div class="main-grid">
    <div class="left-terminal">
      <div class="log-line">[INFO] Loading module...</div>
      <div class="log-line active">[OK] Module 8 active</div>
      <div class="log-line">[INFO] Parsing content...</div>
      <div class="log-line">[DBG] Frame 8/9</div>
    </div>
    <div class="right-main">
      <div class="page-header">
        <span class="header-tag">#08</span>
        <h1 class="page-title">远超套模板工具</h1>
      </div>
      <ul class="bullets">      <li>开源可定制</li>
      <li>本地运行无依赖</li>
      <li>每条成品 1080p</li>
      <li>可手动微调任意环节</li></ul>
      
    </div>
  </div>
  <div class="term-box">$ stream --<span class="green">active</span> --frame=8</div>
  <div class="subtitle-safe-zone"></div>
</div>
</body>
</html>
