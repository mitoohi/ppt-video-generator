<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><style>/* cyber-tech — 赛博朋克 + 终端美学 + 霓虹光效 */
* { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

html, body {
  width: 1920px; height: 1080px; overflow: hidden;
  background: #06080D;
  color: #D4D4D8;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  -webkit-font-smoothing: antialiased;
}

.slide {
  width: 1920px; height: 1080px;
  padding: 90px 100px;
  display: flex; flex-direction: column;
  position: relative;
}

.accent { color: #00FF88; }
.accent-blue { color: #00D4FF; }
.muted { color: #52525B; }
.subtitle-safe-zone { height: 130px; flex-shrink: 0; }

/* 网格背景 */
.slide::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none; z-index: 0;
}
.slide > * { position: relative; z-index: 1; }

.slide-number {
  position: absolute; top: 36px; right: 60px;
  font-size: 14px; font-weight: 600;
  color: #00D4FF;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 2px;
}
.slide-number::before { content: '// '; color: #00FF88; }

table { border-collapse: collapse; width: 100%; margin-top: 24px;
        border: 1px solid rgba(0,255,136,0.12); }
th, td { font-size: 26px; padding: 14px 22px; text-align: left;
         border-bottom: 1px solid rgba(0,255,136,0.08); }
th { color: #00FF88; font-weight: 700; font-size: 22px;
     background: rgba(0,255,136,0.04); }
</style>
<style>
  .slide { justify-content: center; align-items: center; text-align: center; }
  .glow { position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,136,0.06), transparent);
    width: 500px; height: 500px; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 0; }
  .ending-tag {
    font-size: 15px; color: #00D4FF; font-weight: 600;
    letter-spacing: 6px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 24px; position: relative; z-index: 1;
  }
  .ending-title {
    font-size: 62px; font-weight: 700; margin-bottom: 44px;
    color: #00FF88;
    text-shadow: 0 0 25px rgba(0,255,136,0.3);
    position: relative; z-index: 1;
  }
  .ending-bullets { list-style: none; padding: 0; position: relative; z-index: 1; }
  .ending-bullets li { font-size: 28px; color: #52525B; line-height: 2.2; font-family: 'JetBrains Mono', monospace; }
  .ending-bullets li::before { content: '// '; color: #00D4FF; }
  .ending-line { width: 80px; height: 1px; background: #00FF88; margin: 36px auto 0;
                 box-shadow: 0 0 8px rgba(0,255,136,0.3); position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="slide">
  <div class="glow"></div>
  <div class="ending-tag">/* END OF STREAM */</div>
  <h1 class="ending-title">获取方式</h1>
  <ul class="ending-bullets">      <li>Claude Code Skill</li>
      <li>一条命令安装依赖</li>
      <li>一行提示词启动</li>
      <li>去项目主页试试吧</li></ul>
  <div class="ending-line"></div>
</div>
</body>
</html>
