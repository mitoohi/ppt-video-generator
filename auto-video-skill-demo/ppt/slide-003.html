<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><style>/* cyber-tech — 赛博朋克 + 终端美学 + 霓虹光效 */
* { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

html, body {
  width: 1920px; height: 1080px; overflow: hidden;
  background: #06080D;
  color: #D4D4D8;
  font-family: 'JetBrains Mono', 'Noto Sans SC', monospace;
  -webkit-font-smoothing: antialiased;
}

.slide {
  width: 1920px; height: 1080px;
  padding: 90px 100px;
  display: flex; flex-direction: column;
  position: relative;
}

.accent { color: #00FF88; }
.accent-blue { color: #00D4FF; }
.muted { color: #52525B; }
.subtitle-safe-zone { height: 130px; flex-shrink: 0; }

/* 网格背景 */
.slide::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0,255,136,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,136,0.025) 1px, transparent 1px);
  background-size: 50px 50px;
  pointer-events: none; z-index: 0;
}
.slide > * { position: relative; z-index: 1; }

.slide-number {
  position: absolute; top: 36px; right: 60px;
  font-size: 14px; font-weight: 600;
  color: #00D4FF;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 2px;
}
.slide-number::before { content: '// '; color: #00FF88; }

table { border-collapse: collapse; width: 100%; margin-top: 24px;
        border: 1px solid rgba(0,255,136,0.12); }
th, td { font-size: 26px; padding: 14px 22px; text-align: left;
         border-bottom: 1px solid rgba(0,255,136,0.08); }
th { color: #00FF88; font-weight: 700; font-size: 22px;
     background: rgba(0,255,136,0.04); }
</style>
<style>
  .slide { justify-content: center; align-items: center; text-align: center; }
  .section-num {
    font-size: 100px; font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    color: rgba(0,255,136,0.04);
    line-height: 0.9; transform: translateY(-3px); }
  .section-title {
    font-size: 60px; font-weight: 700;
    margin-top: -20px;
    color: #00FF88;
    text-shadow: 0 0 25px rgba(0,255,136,0.3);
  }
  .section-tag {
    font-size: 16px; color: #00D4FF; font-weight: 600;
    letter-spacing: 6px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 20px;
  }
  .section-line {
    width: 120px; height: 2px;
    background: linear-gradient(90deg, #00FF88, #00D4FF);
    margin: 28px auto 0;
    box-shadow: 0 0 10px rgba(0,255,136,0.5);
  }
</style>
</head>
<body>
<div class="slide">
  <div class="section-tag">// SECTION 3</div>
  <div class="section-num">3</div>
  <h1 class="section-title">方案：全自动管线</h1>
  <div class="section-line"></div>
</div>
</body>
</html>
