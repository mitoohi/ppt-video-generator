<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><link rel="stylesheet" href="base.css">
<style>
  .slide { padding-top: 90px; }
  .main-grid {
    display: flex; gap: 72px;
    height: calc(1080px - 180px - 130px);
  }
  /* 左侧色块装饰区 */
  .left-block {
    width: 340px; flex-shrink: 0;
    background: linear-gradient(180deg, rgba(59,130,246,0.15) 0%, rgba(59,130,246,0.03) 40%, rgba(59,130,246,0.06) 100%);
    border-radius: 20px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
    position: relative;
    overflow: hidden;
  }
  .left-block::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, #3B82F6, #60A5FA, #3B82F6);
  }
  .left-block .big-number {
    font-size: 195px; font-weight: 800; color: rgba(59,130,246,0.12);
    line-height: 1;
    font-family: 'Inter', sans-serif;
  }
  .left-block .section-label {
    font-size: 35px; color: #3B82F6; font-weight: 600;
    letter-spacing: 4px; text-transform: uppercase;
    margin-top: -35px;
  }
  /* 右侧内容区 */
  .right-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .page-header {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 58px;
  }
  .header-bar {
    width: 5px; height: 56px;
    background: linear-gradient(180deg, #3B82F6, rgba(59,130,246,0.3));
    border-radius: 3px;
  }
  .page-title {
    font-size: 65px; font-weight: 700; line-height: 1.25;
    letter-spacing: -0.5px;
  }
  .bullets {
    list-style: none; padding: 0 0 0 25px;
    display: flex; flex-direction: column; gap: 24px;
  }
  .bullets li {
    font-size: 49px; line-height: 1.6;
    padding-left: 32px; position: relative;
    color: #CBD5E1;
  }
  .bullets li::before {
    content: '';
    position: absolute; left: 0; top: 14px;
    width: 10px; height: 10px;
    background: #3B82F6; border-radius: 2px;
    transform: rotate(45deg);
  }
  /* 底部装饰条 */
  .decor-strip {
    position: absolute; bottom: 130px; right: 100px;
    display: flex; gap: 6px;
  }
  .decor-strip span {
    width: 40px; height: 3px; border-radius: 2px;
    background: #3B82F6;
  }
  .decor-strip span:nth-child(1) { opacity: 0.2; width: 30px; }
  .decor-strip span:nth-child(2) { opacity: 0.4; }
  .decor-strip span:nth-child(3) { opacity: 0.6; width: 50px; }
  .decor-strip span:nth-child(4) { opacity: 0.8; }
  .decor-strip span:nth-child(5) { opacity: 1.0; width: 20px; }
</style>
</head>
<body>
<div class="slide">
  <div class="slide-number">{{slide_number}}</div>
  <div class="main-grid">
    <div class="left-block">
      <div class="big-number">{{id_large}}</div>
      <div class="section-label">KEY POINT</div>
    </div>
    <div class="right-content">
      <div class="page-header">
        <div class="header-bar"></div>
        <h1 class="page-title">{{title}}</h1>
      </div>
      <ul class="bullets">{{bullets}}</ul>
      {{table}}
    </div>
  </div>
  <div class="decor-strip"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="subtitle-safe-zone"></div>
</div>
</body>
</html>
