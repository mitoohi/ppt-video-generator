<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><link rel="stylesheet" href="base.css">
<style>
  .slide { justify-content: center; align-items: center; text-align: center; padding-bottom: 190px; }
  .quote-tag {
    font-size: 35px; color: #00D4FF; font-weight: 600;
    letter-spacing: 5px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 28px;
  }
  .quote-text {
    font-size: 64px; font-weight: 500; line-height: 1.5;
    max-width: 1300px; color: #E4E4E7;
    text-shadow: 0 0 15px rgba(0,255,136,0.08);
  }
  .quote-line {
    width: 60px; height: 1px; background: #00FF88;
    margin: 28px auto;
    box-shadow: 0 0 8px rgba(0,255,136,0.3);
  }
  .quote-source { font-size: 44px; color: #52525B; font-family: 'JetBrains Mono', monospace; }
  .quote-source::before { content: '-- '; color: #00D4FF; }
</style>
</head>
<body>
<div class="slide">
  <div class="quote-tag">/* QUOTE */</div>
  <p class="quote-text">{{text}}</p>
  <div class="quote-line"></div>
  <p class="quote-source">{{source}}</p>
</div>
</body>
</html>
