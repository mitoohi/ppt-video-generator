<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=1920"><link rel="stylesheet" href="base.css">
<style>
  .slide { justify-content: center; align-items: center; text-align: center; padding-bottom: 190px; }
  .quote-mark {
    font-size: 120px; font-family: 'Noto Serif SC', serif;
    color: #F2CC8F; line-height: 1; margin-bottom: 20px;
  }
  .quote-text {
    font-size: 64px; font-weight: 600;
    font-family: 'Noto Serif SC', serif;
    line-height: 1.5; max-width: 1300px; color: #2D2420;
  }
  .quote-decor {
    width: 50px; height: 2px; background: #E07A5F;
    margin: 28px auto; border-radius: 1px;
  }
  .quote-source { font-size: 46px; color: #8B7E74; }
</style>
</head>
<body>
<div class="slide">
  <div class="quote-mark">"</div>
  <p class="quote-text">{{text}}</p>
  <div class="quote-decor"></div>
  <p class="quote-source">{{source}}</p>
</div>
</body>
</html>
